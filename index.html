<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Open trip in Outbound</title>
<style>
  :root { color-scheme: dark; }
  body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
         background: #121418; color: #f2f3f5; font: 17px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  main { width: min(420px, 100% - 48px); }
  h1 { font-size: 28px; margin: 0 0 8px; }
  p { color: #a7adb7; margin: 0 0 24px; }
  a.button, button { display: block; width: 100%; box-sizing: border-box; padding: 14px; border: 0; border-radius: 12px;
         font: 600 17px/1.2 inherit; text-align: center; text-decoration: none; cursor: pointer; margin-bottom: 12px; }
  a.button { background: #0a84ff; color: #fff; }
  button { background: #2a2d33; color: #f2f3f5; }
  .note { font-size: 15px; }
  .hidden { display: none; }
</style>
</head>
<body>
<main>
  <h1>Open this trip</h1>
  <p id="lead">Opening Outbound…</p>
  <a class="button" id="open" href="#">Open in Outbound</a>
  <button id="copy" type="button">Copy link</button>
  <p class="note">If Outbound does not open, copy the link, then in Outbound tap <b>Trips</b> › <b>+</b> › <b>Join a trip</b>.</p>
</main>
<script>
  // The trip (t=) or the friend's profile (f=) is in the #fragment (never sent to this server). Hand it to the app.
  var m = /[#&]t=([A-Za-z0-9_\-]+)/.exec(location.hash);
  var f = /[#&]f=([A-Za-z0-9_\-]+)/.exec(location.hash);
  var lead = document.getElementById('lead');
  if (!m && !f) {
    lead.textContent = 'This link has nothing in it. Ask for the link again.';
    document.getElementById('open').classList.add('hidden');
    document.getElementById('copy').classList.add('hidden');
  } else {
    if (f && !m) {
      document.querySelector('h1').textContent = 'Add a friend';
      document.querySelector('.note').innerHTML = 'If Outbound does not open, copy the link, then in Outbound tap <b>Profile</b> › <b>Friends</b> › <b>Add by link</b>.';
    }
    var app = m ? 'travelapp://join?t=' + m[1] : 'travelapp://friend?f=' + f[1];
    document.getElementById('open').href = app;
    location.replace(app);
    setTimeout(function () { lead.textContent = m ? 'Tap the button to open the trip in Outbound.' : 'Tap the button to see their profile in Outbound.'; }, 1500);
  }
  document.getElementById('copy').onclick = function () {
    var b = this;
    navigator.clipboard.writeText(location.href).then(function () { b.textContent = 'Copied'; });
  };
</script>
</body>
</html>
